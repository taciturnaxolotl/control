name: Deploy Control

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    uses: taciturnaxolotl/dots/.github/workflows/deploy-service.yml@main
    with:
      service: control
      health_url: https://control.dunkirk.sh/health
      db_path: /var/lib/control/data/control.db
    secrets:
      TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
      TS_OAUTH_SECRET: ${{ secrets.TS_OAUTH_SECRET }}
